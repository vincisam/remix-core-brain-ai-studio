openapi: 3.0.3
info:
  title: AI Platform Developer API
  description: >
    Public API that lets third-party web and mobile applications integrate
    with the AI Platform: issue and manage API keys, run AI inference
    (sync and async), register webhooks for async job events, and monitor
    usage/quota.
  version: "1.0.0"
  contact:
    name: AI Platform Developer Support
    url: https://developers.example.com
    email: developers@example.com
  license:
    name: Proprietary

servers:
  - url: https://api.example.com/v1
    description: Production
  - url: https://sandbox.api.example.com/v1
    description: Sandbox / test environment

tags:
  - name: Keys
    description: API key issuance and lifecycle management
  - name: Inference
    description: Synchronous AI inference calls
  - name: Jobs
    description: Asynchronous / long-running AI task management
  - name: Webhooks
    description: Register and manage callback URLs for async events
  - name: Usage
    description: Usage metering, quotas, and billing info
  - name: Account
    description: Developer account and organization management

security:
  - ApiKeyAuth: []

paths:

  # ---------------------------------------------------------------
  # API KEY MANAGEMENT
  # ---------------------------------------------------------------
  /keys:
    get:
      tags: [Keys]
      summary: List API keys
      description: Returns all API keys belonging to the authenticated account. Raw key values are never returned after creation.
      parameters:
        - name: environment
          in: query
          schema:
            type: string
            enum: [test, live]
          description: Filter keys by environment
      responses:
        "200":
          description: List of API keys
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/ApiKey"
        "401":
          $ref: "#/components/responses/Unauthorized"

    post:
      tags: [Keys]
      summary: Issue a new API key
      description: >
        Creates a new API key scoped to the given permissions. The full key
        value (e.g. \`sk_live_...\`) is returned exactly once in this response
        and cannot be retrieved again — store it securely.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, environment, scopes]
              properties:
                name:
                  type: string
                  example: "Mobile App - Production"
                environment:
                  type: string
                  enum: [test, live]
                scopes:
                  type: array
                  items:
                    $ref: "#/components/schemas/Scope"
                expires_at:
                  type: string
                  format: date-time
                  nullable: true
                  description: Optional expiration. Null means no expiration.
      responses:
        "201":
          description: Key created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiKey"
                  - type: object
                    properties:
                      secret:
                        type: string
                        description: Full key value, shown only once.
                        example: "sk_live_51Hh2x9K3n7pQ..."
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /keys/{keyId}:
    parameters:
      - name: keyId
        in: path
        required: true
        schema:
          type: string

    get:
      tags: [Keys]
      summary: Retrieve an API key's metadata
      responses:
        "200":
          description: Key metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKey"
        "404":
          $ref: "#/components/responses/NotFound"

    patch:
      tags: [Keys]
      summary: Update key metadata (name, scopes, status)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                scopes:
                  type: array
                  items:
                    $ref: "#/components/schemas/Scope"
                status:
                  type: string
                  enum: [active, disabled]
      responses:
        "200":
          description: Updated key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKey"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      tags: [Keys]
      summary: Revoke an API key
      description: Immediately and permanently revokes the key. This action cannot be undone.
      responses:
        "204":
          description: Key revoked
        "404":
          $ref: "#/components/responses/NotFound"

  # ---------------------------------------------------------------
  # INFERENCE (SYNCHRONOUS)
  # ---------------------------------------------------------------
  /completions:
    post:
      tags: [Inference]
      summary: Run a synchronous AI completion
      description: Send input to the AI model and receive a result in the same request/response cycle. Best for low-latency use cases.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompletionRequest"
      responses:
        "200":
          description: Completion result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompletionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"

  # ---------------------------------------------------------------
  # JOBS (ASYNCHRONOUS)
  # ---------------------------------------------------------------
  /jobs:
    post:
      tags: [Jobs]
      summary: Create an asynchronous job
      description: >
        Use for long-running or batch AI tasks. Returns immediately with a
        job ID; poll the job or subscribe via webhook for completion.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompletionRequest"
      responses:
        "202":
          description: Job accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/RateLimited"

    get:
      tags: [Jobs]
      summary: List jobs
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [queued, running, succeeded, failed]
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
        - name: cursor
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Paginated list of jobs
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Job"
                  next_cursor:
                    type: string
                    nullable: true

  /jobs/{jobId}:
    parameters:
      - name: jobId
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [Jobs]
      summary: Get job status and result
      responses:
        "200":
          description: Job details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "404":
          $ref: "#/components/responses/NotFound"

  /jobs/{jobId}/cancel:
    parameters:
      - name: jobId
        in: path
        required: true
        schema:
          type: string
    post:
      tags: [Jobs]
      summary: Cancel a queued or running job
      responses:
        "200":
          description: Job cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "409":
          description: Job already completed and cannot be cancelled

  # ---------------------------------------------------------------
  # WEBHOOKS
  # ---------------------------------------------------------------
  /webhooks:
    get:
      tags: [Webhooks]
      summary: List registered webhooks
      responses:
        "200":
          description: List of webhooks
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Webhook"

    post:
      tags: [Webhooks]
      summary: Register a new webhook endpoint
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url, events]
              properties:
                url:
                  type: string
                  format: uri
                  example: "https://myapp.example.com/hooks/ai-platform"
                events:
                  type: array
                  items:
                    type: string
                    enum: [job.completed, job.failed, key.revoked, usage.threshold_reached]
      responses:
        "201":
          description: Webhook registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Webhook"
        "400":
          $ref: "#/components/responses/BadRequest"

  /webhooks/{webhookId}:
    parameters:
      - name: webhookId
        in: path
        required: true
        schema:
          type: string
    delete:
      tags: [Webhooks]
      summary: Remove a webhook
      responses:
        "204":
          description: Webhook removed
        "404":
          $ref: "#/components/responses/NotFound"

  # ---------------------------------------------------------------
  # USAGE
  # ---------------------------------------------------------------
  /usage:
    get:
      tags: [Usage]
      summary: Get current usage and quota
      parameters:
        - name: period
          in: query
          schema:
            type: string
            enum: [current_billing_cycle, last_30_days]
            default: current_billing_cycle
      responses:
        "200":
          description: Usage summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsageSummary"

  # ---------------------------------------------------------------
  # ACCOUNT
  # ---------------------------------------------------------------
  /account:
    get:
      tags: [Account]
      summary: Get authenticated account/organization details
      responses:
        "200":
          description: Account details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"

components:
  securitySchemes:
    ApiKeyAuth:
      type: http
      scheme: bearer
      bearerFormat: "sk_live_xxx or sk_test_xxx"
      description: >
        Pass the API key as a Bearer token: \`Authorization: Bearer sk_live_xxx\`.
        Never expose live keys in client-side web or mobile code — proxy
        requests through your own backend.

  responses:
    BadRequest:
      description: Invalid request parameters
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Missing, invalid, or revoked API key
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RateLimited:
      description: Rate limit or quota exceeded
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds until the rate limit resets
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Scope:
      type: string
      enum:
        - inference:read
        - inference:write
        - jobs:read
        - jobs:write
        - webhooks:manage
        - usage:read

    ApiKey:
      type: object
      properties:
        id:
          type: string
          example: "key_9f8d7a6b"
        name:
          type: string
        environment:
          type: string
          enum: [test, live]
        prefix:
          type: string
          description: First visible segment of the key, for identification in UIs.
          example: "sk_live_51Hh"
        scopes:
          type: array
          items:
            $ref: "#/components/schemas/Scope"
        status:
          type: string
          enum: [active, disabled]
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
          nullable: true
        expires_at:
          type: string
          format: date-time
          nullable: true

    CompletionRequest:
      type: object
      required: [input]
      properties:
        input:
          type: string
          description: Prompt or input payload sent to the model.
        model:
          type: string
          default: "platform-default"
        max_output_tokens:
          type: integer
          default: 1024
        metadata:
          type: object
          additionalProperties: true
          description: Arbitrary key-value data echoed back in the response, useful for correlating requests in your own system.

    CompletionResponse:
      type: object
      properties:
        id:
          type: string
        output:
          type: string
        usage:
          type: object
          properties:
            input_tokens:
              type: integer
            output_tokens:
              type: integer
        created_at:
          type: string
          format: date-time

    Job:
      type: object
      properties:
        id:
          type: string
          example: "job_3f2a1c"
        status:
          type: string
          enum: [queued, running, succeeded, failed, cancelled]
        input:
          type: string
        result:
          type: object
          nullable: true
        error:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
          nullable: true

    Webhook:
      type: object
      properties:
        id:
          type: string
        url:
          type: string
          format: uri
        events:
          type: array
          items:
            type: string
        status:
          type: string
          enum: [active, disabled]
        signing_secret:
          type: string
          description: Used to verify the HMAC signature on incoming webhook payloads. Returned only on creation.
        created_at:
          type: string
          format: date-time

    UsageSummary:
      type: object
      properties:
        period:
          type: string
        plan:
          type: string
        requests_used:
          type: integer
        requests_quota:
          type: integer
        tokens_used:
          type: integer
        tokens_quota:
          type: integer
        overage_allowed:
          type: boolean

    Account:
      type: object
      properties:
        id:
          type: string
        organization_name:
          type: string
        plan:
          type: string
        created_at:
          type: string
          format: date-time

    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              example: "invalid_api_key"
            message:
              type: string
              example: "The provided API key is invalid or has been revoked."
